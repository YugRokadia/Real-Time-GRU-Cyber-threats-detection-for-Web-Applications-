<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
  <title id="t">Model architecture</title>
  <desc id="d">Ten layers from character input through embedding, spatial dropout, a bidirectional GRU, a second GRU, dense layers with dropout, to a sigmoid output, with notes on the design choices.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07161a"/><stop offset="1" stop-color="#0d3a3a"/></linearGradient></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(284px);opacity:0}}
    .sc{animation:scan 3.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .pu{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.sc,.pu{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="520" rx="22" fill="url(#bg)"/>
  <text class="t" x="40" y="44" font-size="13" font-weight="600" letter-spacing="3" fill="#34d399">MODEL ARCHITECTURE</text>
  <rect x="40" y="70" width="400" height="34" rx="9" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".75"/><text class="t" x="56" y="92" font-size="14.5" font-weight="700" fill="#e8f7f2">Input</text><text class="m" x="424" y="92" font-size="11.5" fill="#9cc7c0" text-anchor="end">characters, max_len = 300</text><path d="M240 104 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="113" width="400" height="34" rx="9" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".75"/><text class="t" x="56" y="135" font-size="14.5" font-weight="700" fill="#e8f7f2">Embedding</text><text class="m" x="424" y="135" font-size="11.5" fill="#9cc7c0" text-anchor="end">128 dimensions</text><path d="M240 147 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="156" width="400" height="34" rx="9" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-opacity=".75"/><text class="t" x="56" y="178" font-size="14.5" font-weight="700" fill="#e8f7f2">SpatialDropout1D</text><text class="m" x="424" y="178" font-size="11.5" fill="#9cc7c0" text-anchor="end">rate 0.15</text><path d="M240 190 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="199" width="400" height="34" rx="9" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".75"/><text class="t" x="56" y="221" font-size="14.5" font-weight="700" fill="#e8f7f2">Bidirectional GRU</text><text class="m" x="424" y="221" font-size="11.5" fill="#9cc7c0" text-anchor="end">128 units · dropout 0.2 · L2</text><path d="M240 233 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="242" width="400" height="34" rx="9" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".75"/><text class="t" x="56" y="264" font-size="14.5" font-weight="700" fill="#e8f7f2">GRU</text><text class="m" x="424" y="264" font-size="11.5" fill="#9cc7c0" text-anchor="end">128 units · dropout 0.2 · L2</text><path d="M240 276 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="285" width="400" height="34" rx="9" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".75"/><text class="t" x="56" y="307" font-size="14.5" font-weight="700" fill="#e8f7f2">Dense</text><text class="m" x="424" y="307" font-size="11.5" fill="#9cc7c0" text-anchor="end">64 · ReLU · L2</text><path d="M240 319 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="328" width="400" height="34" rx="9" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-opacity=".75"/><text class="t" x="56" y="350" font-size="14.5" font-weight="700" fill="#e8f7f2">Dropout</text><text class="m" x="424" y="350" font-size="11.5" fill="#9cc7c0" text-anchor="end">rate 0.3</text><path d="M240 362 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="371" width="400" height="34" rx="9" fill="#a78bfa" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".75"/><text class="t" x="56" y="393" font-size="14.5" font-weight="700" fill="#e8f7f2">Dense</text><text class="m" x="424" y="393" font-size="11.5" fill="#9cc7c0" text-anchor="end">32 · ReLU · L2</text><path d="M240 405 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="414" width="400" height="34" rx="9" fill="#64748b" fill-opacity=".13" stroke="#64748b" stroke-opacity=".75"/><text class="t" x="56" y="436" font-size="14.5" font-weight="700" fill="#e8f7f2">Dropout</text><text class="m" x="424" y="436" font-size="11.5" fill="#9cc7c0" text-anchor="end">rate 0.2</text><path d="M240 448 v9" stroke="#7aa9a2" stroke-width="2"/><rect x="40" y="457" width="400" height="34" rx="9" fill="#fbbf24" fill-opacity=".13" stroke="#fbbf24" stroke-opacity=".75"/><text class="t" x="56" y="479" font-size="14.5" font-weight="700" fill="#e8f7f2">Dense</text><text class="m" x="424" y="479" font-size="11.5" fill="#9cc7c0" text-anchor="end">1 · Sigmoid → benign / malicious</text>
  <rect x="490" y="70" width="470" height="94" rx="14" fill="#0b2a2d" stroke="#22d3ee" stroke-opacity=".6"/><rect x="490" y="70" width="6" height="94" rx="3" fill="#22d3ee"/><text class="t" x="514" y="96" font-size="16" font-weight="700" fill="#e8f7f2">Character-level tokens</text><text class="t" x="514" y="118" font-size="12.5" fill="#9cc7c0">Reads raw payloads, so patterns such as</text><text class="t" x="514" y="135" font-size="12.5" fill="#9cc7c0">&lt;script&gt;, ' OR 1=1 and {{7*7}} are learned,</text><text class="t" x="514" y="152" font-size="12.5" fill="#9cc7c0">not hand-written as rules.</text><rect x="490" y="178" width="470" height="94" rx="14" fill="#0b2a2d" stroke="#34d399" stroke-opacity=".6"/><rect x="490" y="178" width="6" height="94" rx="3" fill="#34d399"/><text class="t" x="514" y="204" font-size="16" font-weight="700" fill="#e8f7f2">Bidirectional first layer</text><text class="t" x="514" y="226" font-size="12.5" fill="#9cc7c0">The first GRU reads each request forwards</text><text class="t" x="514" y="243" font-size="12.5" fill="#9cc7c0">and backwards, so every character is</text><text class="t" x="514" y="260" font-size="12.5" fill="#9cc7c0">interpreted with context from both sides.</text><rect x="490" y="286" width="470" height="94" rx="14" fill="#0b2a2d" stroke="#a78bfa" stroke-opacity=".6"/><rect x="490" y="286" width="6" height="94" rx="3" fill="#a78bfa"/><text class="t" x="514" y="312" font-size="16" font-weight="700" fill="#e8f7f2">Regularized to generalize</text><text class="t" x="514" y="334" font-size="12.5" fill="#9cc7c0">SpatialDropout 15%, dropout 20–30%,</text><text class="t" x="514" y="351" font-size="12.5" fill="#9cc7c0">L2 of 1e-5, learning-rate scheduling and</text><text class="t" x="514" y="368" font-size="12.5" fill="#9cc7c0">early stopping with best-weight restore.</text><rect x="490" y="394" width="470" height="94" rx="14" fill="#0b2a2d" stroke="#fbbf24" stroke-opacity=".6"/><rect x="490" y="394" width="6" height="94" rx="3" fill="#fbbf24"/><text class="t" x="514" y="420" font-size="16" font-weight="700" fill="#e8f7f2">Class-weighted training</text><text class="t" x="514" y="442" font-size="12.5" fill="#9cc7c0">About two thirds of the data is benign,</text><text class="t" x="514" y="459" font-size="12.5" fill="#9cc7c0">so class weights are computed automatically</text><text class="t" x="514" y="476" font-size="12.5" fill="#9cc7c0">to keep the malicious class from being drowned out.</text>
</svg>