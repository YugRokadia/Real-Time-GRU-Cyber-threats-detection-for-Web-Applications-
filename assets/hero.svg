<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">GRU-Based Real-Time Web Threat Detection</title>
  <desc id="d">A request payload read character by character and classified as malicious, next to a benign request classified as benign.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07161a"/><stop offset="1" stop-color="#0d3a3a"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(284px);opacity:0}}
    .sc{animation:scan 3.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .pu{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.sc,.pu{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <text class="t" x="60" y="74" font-size="13" font-weight="600" letter-spacing="3" fill="#34d399">WEB APPLICATION SECURITY</text>
  <text class="t" x="60" y="134" font-size="52" font-weight="800" fill="#e8f7f2">Web Threat</text>
  <text class="t" x="60" y="190" font-size="52" font-weight="800" fill="#e8f7f2">Detection</text>
  <text class="t" x="60" y="228" font-size="18" fill="#9cc7c0">A bidirectional GRU that reads web requests</text>
  <text class="t" x="60" y="252" font-size="18" fill="#9cc7c0">one character at a time to catch attacks.</text>
  <g class="t" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="60"  y="276" width="80"  height="30" rx="15" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/><text x="100" y="296" fill="#6ee7b7">Keras</text>
    <rect x="150" y="276" width="74"  height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/><text x="187" y="296" fill="#67e8f9">GRU</text>
    <rect x="234" y="276" width="86"  height="30" rx="15" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/><text x="277" y="296" fill="#fcd34d">Python</text>
    <rect x="330" y="276" width="124" height="30" rx="15" fill="#f87171" fill-opacity=".12" stroke="#f87171" stroke-opacity=".5"/><text x="392" y="296" fill="#fca5a5">97.86% acc.</text>
  </g>
  <rect x="590" y="50" width="350" height="240" rx="16" fill="#041012" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="m" x="612" y="82" font-size="11" font-weight="700" letter-spacing="2" fill="#7aa9a2">REQUEST PAYLOAD</text>
  <rect x="612" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="624.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">'</text><rect x="640" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="652.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle"> </text><rect x="668" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="680.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">O</text><rect x="696" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="708.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">R</text><rect x="724" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="736.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle"> </text><rect x="752" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="764.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">1</text><rect x="780" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="792.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">=</text><rect x="808" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="820.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">1</text><rect x="836" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="848.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle"> </text><rect x="864" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="876.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">-</text><rect x="892" y="96" width="25" height="30" rx="5" fill="#f87171" fill-opacity=".14" stroke="#f87171" stroke-opacity=".55"/><text class="m" x="904.5" y="117" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">-</text>
  <rect class="sc" x="610" y="92" width="34" height="38" rx="7" fill="#f87171" fill-opacity=".28"/>
  <g class="t" text-anchor="middle">
    <rect class="pu" x="612" y="142" width="130" height="28" rx="14" fill="#f87171" fill-opacity=".18" stroke="#f87171"/>
    <text x="677" y="161" font-size="13" font-weight="700" fill="#fecaca">⚠ MALICIOUS</text>
  </g>
  <line x1="612" y1="190" x2="920" y2="190" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="612" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="624.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">/</text><rect x="640" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="652.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">i</text><rect x="668" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="680.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">n</text><rect x="696" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="708.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">d</text><rect x="724" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="736.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">e</text><rect x="752" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="764.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">x</text><rect x="780" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="792.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">.</text><rect x="808" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="820.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">h</text><rect x="836" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="848.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">t</text><rect x="864" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="876.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">m</text><rect x="892" y="204" width="25" height="30" rx="5" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/><text class="m" x="904.5" y="225" font-size="15" font-weight="700" fill="#e8f7f2" text-anchor="middle">l</text>
