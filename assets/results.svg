<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
  <title id="t">Held-out test results</title>
  <desc id="d">97.86 percent test accuracy, a confusion matrix with 91,721 true negatives, 937 false positives, 2,033 false negatives and 44,315 true positives, and precision and recall per class.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07161a"/><stop offset="1" stop-color="#0d3a3a"/></linearGradient></defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace}
    @keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(284px);opacity:0}}
    .sc{animation:scan 3.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .pu{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.sc,.pu{animation:none;opacity:1}}
  </style>
  <rect width="1000" height="470" rx="22" fill="url(#bg)"/>
  <text class="t" x="40" y="44" font-size="13" font-weight="600" letter-spacing="3" fill="#34d399">HELD-OUT TEST RESULTS</text>
  <rect x="40" y="62" width="216" height="86" rx="14" fill="#0b2a2d" stroke="#34d399" stroke-opacity=".6"/><text class="t" x="148" y="104" font-size="26" font-weight="800" fill="#e8f7f2" text-anchor="middle">97.86%</text><text class="t" x="148" y="128" font-size="12" fill="#9cc7c0" text-anchor="middle">test accuracy</text><rect x="272" y="62" width="216" height="86" rx="14" fill="#0b2a2d" stroke="#22d3ee" stroke-opacity=".6"/><text class="t" x="380" y="104" font-size="26" font-weight="800" fill="#e8f7f2" text-anchor="middle">98% / 98%</text><text class="t" x="380" y="128" font-size="12" fill="#9cc7c0" text-anchor="middle">precision, benign / malicious</text><rect x="504" y="62" width="216" height="86" rx="14" fill="#0b2a2d" stroke="#a78bfa" stroke-opacity=".6"/><text class="t" x="612" y="104" font-size="26" font-weight="800" fill="#e8f7f2" text-anchor="middle">139,006</text><text class="t" x="612" y="128" font-size="12" fill="#9cc7c0" text-anchor="middle">held-out test samples</text><rect x="736" y="62" width="216" height="86" rx="14" fill="#0b2a2d" stroke="#fbbf24" stroke-opacity=".6"/><text class="t" x="844" y="104" font-size="26" font-weight="800" fill="#e8f7f2" text-anchor="middle">0.006</text><text class="t" x="844" y="128" font-size="12" fill="#9cc7c0" text-anchor="middle">final train / val loss gap</text>
  <text class="t" x="40" y="186" font-size="14" font-weight="700" fill="#e8f7f2">Confusion matrix</text>
  <text class="t" x="215" y="208" font-size="11.5" fill="#9cc7c0" text-anchor="middle">Predicted benign</text>
  <text class="t" x="375" y="208" font-size="11.5" fill="#9cc7c0" text-anchor="middle">Predicted malicious</text>
  <text class="t" x="128" y="263" font-size="11.5" fill="#9cc7c0" text-anchor="end">Actual</text>
  <text class="t" x="128" y="278" font-size="11.5" fill="#9cc7c0" text-anchor="end">benign</text>
  <text class="t" x="128" y="363" font-size="11.5" fill="#9cc7c0" text-anchor="end">Actual</text>
  <text class="t" x="128" y="378" font-size="11.5" fill="#9cc7c0" text-anchor="end">malicious</text>
  <rect x="140" y="214" width="150" height="90" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-opacity=".75"/><text class="t" x="215" y="260" font-size="24" font-weight="800" fill="#e8f7f2" text-anchor="middle">91,721</text><text class="m" x="215" y="282" font-size="12" fill="#cfe8e3" text-anchor="middle">TN</text><rect x="300" y="214" width="150" height="90" rx="12" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-opacity=".75"/><text class="t" x="375" y="260" font-size="24" font-weight="800" fill="#e8f7f2" text-anchor="middle">937</text><text class="m" x="375" y="282" font-size="12" fill="#cfe8e3" text-anchor="middle">FP</text><rect x="140" y="314" width="150" height="90" rx="12" fill="#f87171" fill-opacity=".16" stroke="#f87171" stroke-opacity=".75"/><text class="t" x="215" y="360" font-size="24" font-weight="800" fill="#e8f7f2" text-anchor="middle">2,033</text><text class="m" x="215" y="382" font-size="12" fill="#cfe8e3" text-anchor="middle">FN</text><rect x="300" y="314" width="150" height="90" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-opacity=".75"/><text class="t" x="375" y="360" font-size="24" font-weight="800" fill="#e8f7f2" text-anchor="middle">44,315</text><text class="m" x="375" y="382" font-size="12" fill="#cfe8e3" text-anchor="middle">TP</text>
  <text class="t" x="560" y="186" font-size="14" font-weight="700" fill="#e8f7f2">Per-class precision and recall</text>
  <text class="t" x="560" y="226" font-size="13" font-weight="600" fill="#cfe8e3">Precision · benign</text><rect x="560" y="236" width="380" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect x="560" y="236" width="372" height="14" rx="7" fill="#22d3ee"/><text class="t" x="940" y="226" font-size="13" font-weight="700" fill="#e8f7f2" text-anchor="end">98%</text><text class="t" x="560" y="278" font-size="13" font-weight="600" fill="#cfe8e3">Precision · malicious</text><rect x="560" y="288" width="380" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect x="560" y="288" width="372" height="14" rx="7" fill="#22d3ee"/><text class="t" x="940" y="278" font-size="13" font-weight="700" fill="#e8f7f2" text-anchor="end">98%</text><text class="t" x="560" y="330" font-size="13" font-weight="600" fill="#cfe8e3">Recall · benign</text><rect x="560" y="340" width="380" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect x="560" y="340" width="376" height="14" rx="7" fill="#34d399"/><text class="t" x="940" y="330" font-size="13" font-weight="700" fill="#e8f7f2" text-anchor="end">99%</text><text class="t" x="560" y="382" font-size="13" font-weight="600" fill="#cfe8e3">Recall · malicious</text><rect x="560" y="392" width="380" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect x="560" y="392" width="365" height="14" rx="7" fill="#34d399"/><text class="t" x="940" y="382" font-size="13" font-weight="700" fill="#e8f7f2" text-anchor="end">96%</text>
</svg>